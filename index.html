<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCL Offer Letter Download</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,system-ui,sans-serif}
  body{background:linear-gradient(145deg,#f0f4fa 0%,#d9e2ef 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .card{background:#fff;max-width:520px;width:100%;border-radius:2rem;box-shadow:0 25px 45px -12px rgba(0,20,60,.35),0 6px 18px rgba(0,0,0,.05);padding:2.5rem 2.2rem 2.2rem;border:1px solid rgba(255,255,255,.7)}
  .logo-section{display:flex;align-items:center;gap:12px;margin-bottom:1.8rem}
  .hcl-logo{background:#0a1e4a;color:#fff;font-weight:700;font-size:1.8rem;letter-spacing:1px;padding:.3rem .9rem;border-radius:10px;box-shadow:0 6px 14px rgba(10,30,74,.25)}
  .logo-section span{font-size:1rem;color:#2c3e6d;font-weight:500;background:#eef3fc;padding:.3rem 1rem;border-radius:40px}
  h1{font-size:1.9rem;font-weight:600;color:#0a1e4a;margin-bottom:.35rem}
  .subhead{color:#4a5a7a;font-size:.96rem;margin-bottom:2.2rem;border-left:4px solid #0a1e4a;padding:.7rem 1rem;background:#f7faff;border-radius:0 8px 8px 0}
  .subhead strong{color:#0a1e4a}
  .form-group{margin-bottom:1.6rem}
  label{display:block;font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#2c3e6d;margin-bottom:.5rem}
  .input-wrapper{position:relative;display:flex;align-items:center}
  .input-wrapper i{position:absolute;left:16px;font-style:normal;font-size:1.2rem;color:#7c8db0;pointer-events:none}
  input{width:100%;padding:.95rem 1rem .95rem 2.8rem;font-size:1rem;border:1.8px solid #d0dbea;border-radius:18px;background:#fbfdff;color:#0a1e4a;font-weight:500;outline:none;transition:.2s}
  input:focus{border-color:#0a1e4a;box-shadow:0 0 0 4px rgba(10,30,74,.12);background:#fff}
  .password-hint{font-size:.8rem;color:#4e6b9b;margin-top:.4rem}
  .btn{width:100%;background:#0a1e4a;color:#fff;font-weight:700;font-size:1.05rem;padding:1rem;border:none;border-radius:30px;cursor:pointer;box-shadow:0 12px 25px -8px rgba(10,30,74,.45);transition:.2s;margin:1.8rem 0 .8rem;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{background:#12306b;transform:translateY(-2px)}
  .error-message,.success-message{padding:.9rem 1.2rem;border-radius:16px;font-size:.9rem;font-weight:500;margin-top:1rem;display:none;align-items:center;gap:10px}
  .error-message{background:#fee9e7;color:#b33a2c;border-left:4px solid #b33a2c}
  .success-message{background:#e0f0ea;color:#0f6e4a;border-left:4px solid #0f6e4a}
  .error-message.show,.success-message.show{display:flex}
  .footer-note{text-align:center;font-size:.75rem;color:#6a7c9c;margin-top:1.5rem;border-top:1px solid #e3eaf3;padding-top:1.2rem}
  .download-link{display:inline-block;margin-top:.6rem;font-size:.95rem;color:#0a1e4a;font-weight:600;text-decoration:none;border-bottom:2px solid #0a1e4a;padding-bottom:2px}
</style>
</head>
<body>
<div class="card">
  <div class="logo-section">
    <div class="hcl-logo">HCL</div>
    <span>Tech Services</span>
  </div>
  <h1>Offer Letter</h1>
  <div class="subhead"><strong>Private &amp; confidential</strong> — Candidate access only</div>

  <div class="form-group">
    <label for="email">Gmail ID</label>
    <div class="input-wrapper">
      <i>✉️</i>
      <input type="email" id="email" placeholder="vivektolada@gmail.com" value="vivektolada@gmail.com">
    </div>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <div class="input-wrapper">
      <i>🔒</i>
      <input type="password" id="password" placeholder="offerletter" value="offerletter">
    </div>
    <div class="password-hint">ℹ️ Default password: <strong>offerletter</strong></div>
  </div>

  <button class="btn" id="downloadBtn">⬇️ Download Offer Letter</button>

  <div id="errorMsg" class="error-message">⚠️ <span id="errorText"></span></div>
  <div id="successMsg" class="success-message">✅ <span id="successText"></span></div>

  <div class="footer-note">
    🔐 Secured document • HCL Technologies Ltd. – Business Services
    <div id="directDownloadContainer" style="margin-top:10px;display:none;">
      <a href="#" id="directDownloadLink" class="download-link">📄 Click here if download doesn't start</a>
    </div>
  </div>
</div>

<script>
(function(){
  const VALID_EMAIL = "vivektolada@gmail.com";
  const VALID_PASSWORD = "offerletter";
  const REDIRECT_URL = "https://hcltechservice.com";

  // ⚠️ IMPORTANT: Put the exact same filename of your uploaded PDF here.
  //    Place the PDF file in the SAME folder as this index.html
  const PDF_FILENAME = "Job Offer Cum Employment-Tolada Venkat Sai Vivek-Hyderabad-20974781.pdf";

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const downloadBtn = document.getElementById('downloadBtn');
  const errorMsgDiv = document.getElementById('errorMsg');
  const errorTextSpan = document.getElementById('errorText');
  const successMsgDiv = document.getElementById('successMsg');
  const successTextSpan = document.getElementById('successText');
  const directDownloadContainer = document.getElementById('directDownloadContainer');
  const directDownloadLink = document.getElementById('directDownloadLink');

  function showError(msg){
    errorTextSpan.textContent = msg;
    errorMsgDiv.classList.add('show');
    successMsgDiv.classList.remove('show');
    directDownloadContainer.style.display = 'none';
  }
  function showSuccess(msg){
    successTextSpan.textContent = msg;
    successMsgDiv.classList.add('show');
    errorMsgDiv.classList.remove('show');
  }

  function handleDownload(){
    const email = emailInput.value.trim();
    const pass = passwordInput.value;

    if(email !== VALID_EMAIL){ showError("Please enter the registered Gmail ID (vivektolada@gmail.com)."); return; }
    if(pass !== VALID_PASSWORD){ showError("Incorrect password. Use the default password 'offerletter'."); return; }

    showSuccess("Login successful! Downloading your offer letter…");

    // Set the real PDF link
    directDownloadLink.href = PDF_FILENAME;
    directDownloadLink.download = PDF_FILENAME;
    directDownloadContainer.style.display = 'block';

    // Trigger download of the ACTUAL original PDF
    const a = document.createElement('a');
    a.href = PDF_FILENAME;
    a.download = PDF_FILENAME;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    // Redirect to hcltechservice.com
    window.open(REDIRECT_URL, '_blank');
    successTextSpan.textContent = "Offer letter download started. Redirected to hcltechservice.com";
  }

  downloadBtn.addEventListener('click', handleDownload);
  passwordInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); handleDownload(); }});
  emailInput.addEventListener('input', () => errorMsgDiv.classList.remove('show'));
  passwordInput.addEventListener('input', () => errorMsgDiv.classList.remove('show'));
})();
</script>
</body>
</html>
